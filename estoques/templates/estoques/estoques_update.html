{% extends "base.html" %}

{% load static %}

{%block title%}Editar Estoque - BGstock{%endblock%}

{% block content %}

<h1>Editar {{ estoque }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
    <a href="{% url 'estoques:estoques_list' %}" class="btn btn-sm btn-secondary">Cancelar</a>
</form>

{% endblock %}

{% extends "base.html" %}

{% block title %}Adicionar Produto - BGstock{% endblock %}

{% block content %}

<h1>Novo Produto</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-sm btn-primary">Criar</button>
    <a href="{% url 'produtos:produtos_list' %}" class="btn btn-sm btn-secondary">Cancelar</a>
</form>

{% endblock %}

{%extends "base.html"%}
{%load static%}

{%block title%}Deletar Produto - BGstock{%endblock%}

{%block content%}
<h1>Deletar produto {{ produto.produto_nome }} </h1>
<form method="post">
    {%csrf_token%}
    <a href="{% url 'produtos:produtos_list' %}" class="btn btn-sm btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-sm btn-danger">Deletar</button>
</form>

{%endblock%}
